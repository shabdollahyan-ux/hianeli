<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ویزیتور‌یار هیانلی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-thumb chat. Deep-green header with progress, conversation on a pale herb ground, answer tray rising from the bottom.
   Hianeli palette: deep navy + saffron; saffron for progress and the ID card only. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --bot:#ffffff; --ink:#151c2e; --muted:#5a6478; --line:#d3dae8;
  --brand:#2a3f86; --brand-ink:#ffffff; --soft:#e3e8f3; --gold:#e3a33a; --goldbg:#fbf1dc; --warn:#a0461c;
  --head:#1a2550; --head-ink:#f2f4fa; --head-mute:#b5bedb;
  --shadow:0 1px 2px rgba(21,28,46,.07),0 3px 10px rgba(21,28,46,.06);
  --font:"Vazirmatn","Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif; --display:"Vazirmatn",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d111c; --surface:#151b2b; --bot:#1e2640; --ink:#e6e9f2; --muted:#959db3; --line:#273049;
  --brand:#8fa6f2; --brand-ink:#0b1020; --soft:#1e2640; --gold:#e8b453; --goldbg:#2e2412; --warn:#f0a07a;
  --head:#111833; --head-ink:#e9ecf7; --head-mute:#98a3c7;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d111c; --surface:#151b2b; --bot:#1e2640; --ink:#e6e9f2; --muted:#959db3; --line:#273049;
  --brand:#8fa6f2; --brand-ink:#0b1020; --soft:#1e2640; --gold:#e8b453; --goldbg:#2e2412; --warn:#f0a07a;
  --head:#111833; --head-ink:#e9ecf7; --head-mute:#98a3c7;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin-inline:auto;background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--head);color:var(--head-ink)}
.logo{width:42px;height:42px;border-radius:12px;background:var(--head-ink);color:var(--head);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;flex:none;border:0;cursor:pointer;position:relative}
.logo::after{content:"";position:absolute;inset-inline-end:-3px;bottom:-3px;width:12px;height:12px;border-radius:4px;background:var(--gold);border:2px solid var(--head)}
.hd{flex:1;min-width:0}
.hd b{display:block;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd span{font-size:12px;color:var(--head-mute)}
.linkbtn{background:none;border:0;color:var(--brand);font:inherit;font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px}
header .linkbtn{color:var(--head-ink);background:rgba(255,255,255,.1);font-size:12.5px;white-space:nowrap}
header .linkbtn:hover{background:rgba(255,255,255,.18)}
.prog{height:4px;background:var(--head)}
.prog i{display:block;height:100%;background:var(--gold);border-start-end-radius:4px;border-end-end-radius:4px;transition:width .3s ease}
.chat{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;line-height:1.8;white-space:pre-wrap;word-break:break-word;animation:pop .22s ease-out}
.bot{align-self:flex-start;background:var(--bot);border-start-start-radius:6px;box-shadow:var(--shadow)}
.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-start-end-radius:6px}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.hint{font-size:13px;color:var(--warn);align-self:flex-start;background:var(--goldbg);padding:4px 10px;border-radius:8px}
.sub{font-size:13px;color:var(--muted);align-self:flex-start;max-width:86%;line-height:1.75;padding-inline:4px}
.bar{background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(21,28,46,.08);padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:58%;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;padding:9px 16px;min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--brand)}
.chip:active{background:var(--soft)}
.chip.soft{color:var(--muted);background:var(--bg);border-color:transparent}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.card{border-radius:14px;text-align:start;width:100%;padding:10px 14px}
.chip.card small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.6}
.chip.card.on small{color:inherit;opacity:.85}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row label{flex:1;font-size:15px}
.row .num{flex:0 0 90px;text-align:center;font-variant-numeric:tabular-nums}
input:focus,textarea:focus,.chip:focus-visible,.btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{font:inherit;font-weight:700;padding:11px 18px;min-height:46px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);cursor:pointer;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(28,43,94,.25);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.btn.sm{padding:7px 12px;min-height:0;font-size:13px;font-weight:500}
.back{align-self:flex-start}
.out{width:100%;min-height:340px;font:inherit;font-size:14.5px;line-height:1.85;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.done{display:flex;flex-direction:column;gap:10px;align-self:stretch}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.me img{display:block;max-width:180px;border-radius:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.logo.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--gold)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.idbig{font-size:26px;font-weight:800;direction:ltr;text-align:center;letter-spacing:.08em;padding:12px;border-radius:14px;background:var(--goldbg);color:var(--ink);border:1.5px dashed var(--gold);font-variant-numeric:tabular-nums}
.ver{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.logo.pulse{outline:3px solid var(--gold);outline-offset:3px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="logo" id="logo" aria-label="لوگو">H</button>
    <div class="hd"><b id="who">ویزیتور‌یار هیانلی</b><span id="sub">نسخه آفلاین</span></div>
    <button class="linkbtn" id="rename" hidden>تغییر ویزیتور</button>
    <button class="linkbtn" id="viewBtn" hidden>ویزیت‌نشود</button>
    <button class="linkbtn" id="histBtn" hidden>ویزیت‌های اخیر</button>
  </header>
  <div class="prog"><i id="prog" style="width:0"></i></div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="bar" id="bar"></div>
  <input type="file" accept="image/*" capture="environment" class="file" id="cam" tabindex="-1">
  <input type="file" accept="image/*" class="file" id="gal" tabindex="-1">
</div>

function j2g(jy,jm,jd){
  jy+=1595; let days=-355668+(365*jy)+(~~(jy/33)*8)+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  let gy=400*~~(days/146097); days%=146097;
  if(days>36524){ gy+=100*~~(--days/36524); days%=36524; if(days>=365) days++; }
  gy+=4*~~(days/1461); days%=1461;
  if(days>365){ gy+=~~((days-1)/365); days=(days-1)%365; }
  let gd=days+1; const sal=[0,31,((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm; for(gm=0;gm<13&&gd>sal[gm];gm++) gd-=sal[gm];
  return new Date(gy,gm-1,gd,12,0,0);
}
function fuToDate(label){

  const m=fa2en(label||'').match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
  if(m){ const jm=+m[2], jd=+m[3]; if(jm<1||jm>12||jd<1||jd>31) return null; return j2g(+m[1],jm,jd); }
  if(ADD[label]){ d.setDate(d.getDate()+ADD[label]); return d; }

}

  {k:'fuTopic', q:a=>['علاقه‌مند، پیگیری لازم','نمونه خواست'].includes(a.result)?'پیگیری بعدی چیه؟ (لازمه)':'پیگیری بعدی؟', type:'choice', opts:['صحبت با مسئول خرید','نظرسنجی نمونه','گرفتن سفارش'], other:'سایر', skip:a=>['علاقه‌مند، پیگیری لازم','نمونه خواست'].includes(a.result)?null:'لازم نیست', cond:a=>isNew(a)&&(isAB)(a)},
  {k:'fuDay', q:'کِی؟', type:'choice', opts:['فردا','پس‌فردا','شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','یک هفته بعد','دو هفته بعد','یک ماه بعد'], other:'تاریخ دقیق', otherPh:()=>'تاریخ شمسی، مثلاً '+faDate(new Date(Date.now()+20*864e5)), cond:a=>isNew(a)&&(a=>isAB(a)&&a.fuTopic&&a.fuTopic!=='لازم نیست')(a)},
  {k:'note', q:'توضیح اضافه؟', sub:'مثلاً: مسئول خرید نبود، صبح‌ها هست / فروشنده خیلی استقبال کرد / مغازه در حال بازسازیه', type:'text', skip:'نه', cond:isNew}
];

const QUICK_SKIP=new Set(['photoFront','freezer','photoFreezer','space','qalamak','inactiveWhy','result','order','discount','cash','terms','samples','rejectWhy','fuTopic','fuDay']);
function skipStep(s){
  if(isQuick(st.ans) && QUICK_SKIP.has(s.k)) return true;
  return s.cond ? !s.cond(st.ans) : false;
}
function nextIdx(from){ for(let i=from;i<S.length;i++){ if(!skipStep(S[i])) return i; } return -1; }
const val = f => typeof f==='function' ? f(st.ans) : f;

const chat=$('chat'), bar=$('bar');
function bubble(cls, txt){ const d=el('div','msg '+cls,txt); chat.appendChild(d); return d; }
function stockText(o){ if(!o) return ''; const t=PRODUCTS.reduce((x,p)=>x+(+o[p[0]]||0),0); return t? PRODUCTS.filter(p=>+o[p[0]]>0).map(p=>p[1]+' '+o[p[0]]).join('، ') : 'همه تموم شده'; }
function orderText(o){ if(!o) return ''; const parts=PRODUCTS.filter(p=>+o[p[0]]>0).map(p=>p[1]+' '+o[p[0]]); const tot=PRODUCTS.reduce((t,p)=>t+(+o[p[0]]||0),0); return parts.join('، ')+` (جمع ${tot} پک ≈ ${(tot/PACKS_PER_CARTON).toFixed(2)} کارتن)`; }
function showAnswer(i){
  const s=S[i], v=st.ans[s.k];
  if(s.type==='photo' && photos[s.slot]){ const b=bubble('me',''); const im=el('img'); im.src=photos[s.slot]; im.alt='عکس'; b.appendChild(im); return; }
  if(s.type==='order') return bubble('me', orderText(v));
  if(s.type==='stock') return bubble('me', 'مانده: '+stockText(v));
  if(s.type==='store'){ const c=CUST.find(x=>x.code===v); return bubble('me', c? c.name+' · \u2066'+c.code+'\u2069' : '\u2066'+v+'\u2069'); }
  if(s.type==='multi') return bubble('me', (v||[]).join('، '));
  if(s.k==='region') return bubble('me','منطقه '+v);
  if(s.k==='area') return bubble('me','محدوده '+v);
  if(s.k==='route') return bubble('me','مسیر '+v);
  bubble('me', v);
}

      const b=el('button','chip card'); const why=dueReason(c); b.append(el('b',null,c.name+' · \u2066'+c.code+'\u2069'), el('small',null,[c.street, c.lastOrder?'آخرین سفارش '+c.lastOrder:'بدون سفارش', why?'⏰ '+why:''].filter(Boolean).join(' · '))); b.onclick=()=>{ st.ans.storeName=c.name; answer(c.code, true); }; return b; };

function textRow(ph, cb, numeric){
  const row=el('div','row'); const inp=el('input'); inp.id='ans'; inp.type='text'; inp.placeholder=ph; if(numeric) inp.inputMode='tel';

function backBtn(){ if(st.hist.length || st.other){ const b=el('button','linkbtn back','→ برگرد به سؤال قبل'); b.onclick=back; bar.appendChild(b); } }
function scroll(){ chat.scrollTop=chat.scrollHeight; }

/* ---------- answers ---------- */
function answer(raw, keep){
  const s=S[st.idx]; let v=raw;
  if(!keep){ v=fa2en(String(raw).trim()); if(!v) return render('جواب خالیه.'); }
  if((s.type==='num' || s.numeric) && typeof v==='string' && !/^\d+$/.test(v)) return render('فقط عدد بنویس.');
  if(s.k==='discount'||s.k==='rDiscount'){ const n=parseFloat(fa2en(String(v)).replace(/[^\d.]/g,'')); if(isNaN(n)||n<0||n>100){ st.other=String(v).startsWith('درصد'); return render('درصد تخفیف را به عدد بنویس (۰ تا ۱۰۰).'); } v=String(n); }
  if(s.k==='fuDay'||s.k==='rFuDay'){
    const d=fuToDate(v), t=new Date(); t.setHours(0,0,0,0);
    if(!d || isNaN(d)) { st.other=true; return render('تاریخ رو این‌طوری بنویس: سال/ماه/روز، مثلاً '+faDate(new Date(Date.now()+20*864e5))); }
    if(d<=t) { st.other=true; return render('این تاریخ گذشته؛ یه تاریخ بعد از امروز بنویس.'); }
    if(d-t>366*864e5) { st.other=true; return render('بیشتر از یک سال بعده؛ تاریخ رو چک کن.'); }
  }
  st.other=false; st.otherLabel=null;
  st.ans[s.k]=v;
  if(BLOCK_KEYS.has(s.k)) checkBlock();
  st.hist.push(st.idx); st.idx=nextIdx(st.idx+1); save(); render();
}
function back(){
  if(st.other){ st.other=false; return render(); }
  st.idx=st.hist.pop(); const s=S[st.idx]; delete st.ans[s.k]; if(s.slot) delete photos[s.slot]; if(BLOCK_KEYS.has(s.k)) checkBlock(); save(); render();
}

  const s=S[st.idx]; if(!s || s.slot!==camSlot) return;
  try{ photos[camSlot]=await shrink(f); }
  catch(err){ return render('عکس خونده نشد؛ دوباره امتحان کن یا «عکس رو جدا می‌فرستم» رو بزن.'); }
  answer('عکس گرفته شد', true);
}));
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const m=1280, k=Math.min(1, m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.75)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); }; img.src=url;
  });
}
function dataUrlToFile(u, name){
  const [h,b]=u.split(','); const bin=atob(b); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new File([arr], name, {type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'});
}
function photoFiles(){
  const safe=(st.ans.name||st.ans.storeName||'store').replace(/[\\/:*?"<>|\s]+/g,'-');
  return [['front','سردر'],['freezer','فریزر'],['shelf','چیدمان']].filter(([k])=>photos[k]).map(([k,l])=>dataUrlToFile(photos[k], `${safe}-${l}.jpg`));
}

/* ---------- output ---------- */
function buildRevisit(){
  const a=st.ans, now=new Date(), c=custOf(a)||{};
  const L=['#ویزیت_مجدد', `ویزیتور: ${me.visitor}`, `شناسه: ${me.id}`, `تاریخ: ${faDate(now)} – ${now.toTimeString().slice(0,5)}`,
    `نوع ویزیت: ${a.channel}`, `کد فروشگاه: ${a.store}`, `نام فروشگاه: ${c.name||a.storeName||''}`];
  if(a.stock) L.push(`موجودی (پک): ${stockText(a.stock)}`);
  if(a.photoShelf) L.push(`عکس چیدمان: ${a.photoShelf}`);
  L.push(`نتیجه: ${a.rResult}`);
  if(a.rOrder) L.push(`سفارش (پک): ${orderText(a.rOrder)}`);
  if(a.rDiscount) L.push(`تخفیف گفته‌شده: ${a.rDiscount}٪`);
  if(a.rCash) L.push(`تسویه نقدی موقع تحویل: ${a.rCash==='بله'?'پذیرفت ('+(c.buyer||'')+')':'نپذیرفت – '+a.rTerms}`);
  if(a.problem) L.push(`مشکل: ${a.problem}`);
  if(a.rReject) L.push(`دلیل رد: ${a.rReject}`);
  L.push(`بازخورد: ${a.feedback}`, `تغییر مشخصات: ${a.changes}`);
  if(a.rFuTopic && a.rFuTopic!=='لازم نیست'){ const d=fuToDate(a.rFuDay); L.push(`پیگیری: ${a.rFuTopic} – ${d?faDate(d):''} (${a.rFuDay})`); }
  L.push(`توضیح: ${a.rNote}`);
  if(a.rCash==='نه') L.push('⚠ نیاز به تأیید سرپرست');
  return L.join('\n');
}
function buildText(){
  if(isRe(st.ans)) return buildRevisit();
  const a=st.ans, now=new Date();
  const L=['#ویزیت',
    `ویزیتور: ${me.visitor}`, `شناسه: ${me.id}`, `تاریخ: ${faDate(now)} – ${now.toTimeString().slice(0,5)}`,
    `منطقه-محدوده-مسیر: ${visitRegion(a)}-${a.area||0}-${a.route||0}`];
  if(isQuick(a)) L.push('نوع ثبت: ثبت سریع');
  if(isRep()) L.push('نوع ویزیتور: نماینده');
  L.push(`نام فروشگاه: ${a.name}`);
  if(a.photoFront) L.push(`عکس سردر: ${a.photoFront}`);
  L.push(`نوع: ${a.kind}`);
  if(a.branches) L.push(`شعبه دیگر: ${a.branches}${a.branchCount?' ('+a.branchCount+' شعبه)':''}`);
  L.push(`آدرس: ${a.street}`,`لوکیشن: ${a.loc}`, `تلفن فروشگاه: ${a.phone}`,
    `مسئول خرید: ${a.buyer} – ${a.role}`, `موبایل: ${a.mobile}`);
  if(a.freezer) L.push(`فریزر: ${a.freezer}`);
  if(a.photoFreezer) L.push(`عکس فریزر: ${a.photoFreezer}`);
  if(a.space) L.push(`جای خالی فریزر: ${a.space}`);
  if(a.qalamak) L.push(`قلمک: ${a.qalamak}${a.inactiveWhy?' – '+a.inactiveWhy:''}`);
  L.push(`رتبه: ${a.grade}`);
  if(a.result) L.push(`نتیجه: ${a.result}`);
  if(a.order) L.push(`سفارش (پک): ${orderText(a.order)}`);
  if(a.discount) L.push(`تخفیف گفته‌شده: ${a.discount}٪`);
  if(a.cash) L.push(`تسویه نقدی موقع تحویل: ${a.cash==='بله'?'پذیرفت ('+a.buyer+')':'نپذیرفت – '+a.terms}`);
  if(a.samples) L.push(`نمونه: ${a.samples.join('، ')}`);
  if(a.rejectWhy) L.push(`دلیل رد: ${a.rejectWhy}`);
  if(a.fuTopic && a.fuTopic!=='لازم نیست'){ const d=fuToDate(a.fuDay); L.push(`پیگیری: ${a.fuTopic} – ${d?faDate(d):''} (${a.fuDay})`); }
  L.push(`توضیح: ${a.note}`);
  const flags=[]; if(st.block) flags.push(st.block.lvl==='strong'?(st.block.r==='q'?'مشتری فعلی قلمک (فهرست)':'فروشگاه ویزیتور دیگر (فهرست)'):'شبیه فروشگاه ثبت‌شده'); if(a.loc==='ندارم') flags.push('لوکیشن ناقص'); if(a.cash==='نه') flags.push('نیاز به تأیید سرپرست');
  if(flags.length) L.push(`⚠ ${flags.join(' / ')}`);
  return L.join('\n');
}
/* ---------- recent visits (kept on the phone) ---------- */
const HIST_MAX=30, HIST_PHOTOS=3;
function histAll(){ return ls.get('hist')||[]; }
function histSave(L){ L=L.slice(0,HIST_MAX); L.forEach((h,i)=>{ if(i>=HIST_PHOTOS) delete h.photos; }); ls.set('hist',L); if((ls.get('hist')||[]).length!==L.length){ L.forEach(h=>delete h.photos); ls.set('hist',L); } }
function histUpsert(key, patch){ const L=histAll(); const i=L.findIndex(h=>h.key===key); if(i>=0) Object.assign(L[i],patch); else L.unshift(Object.assign({key},patch)); histSave(L); }
async function shareAgain(h, info){
  const files=(h.photos||[]).map((u,i)=>dataUrlToFile(u,`visit-${i+1}.jpg`));
  try{
    if(files.length && navigator.canShare && navigator.canShare({files})){ await navigator.share({files, text:h.text}); }
    else if(navigator.share){ await navigator.share({text:h.text}); }
    else throw new Error('noshare');
    histUpsert(h.key,{sent:true}); renderHistory('ارسال شد ✓');
  }catch(e){ if(e&&e.name==='AbortError') return; const t=el('textarea'); t.value=h.text; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); info.textContent='متن کپی شد؛ توی واتس‌اپ یا بله بچسبون.'; }catch(x){} t.remove(); }
}
function renderHistory(hint){
  chat.innerHTML=''; bar.innerHTML='';
  bubble('bot','ویزیت‌های اخیر این گوشی ('+histAll().length+'). عکس فقط برای '+HIST_PHOTOS+' ویزیت آخر نگه داشته می‌شود.');
  if(hint) chat.appendChild(el('div','hint',hint));
  const L=histAll();
  if(!L.length) chat.appendChild(el('div','sub','هنوز ویزیتی ثبت نشده.'));
  L.forEach(h=>{ const b=el('div','msg bot'); b.style.maxWidth='100%';
    b.append(el('b',null,(h.name||'بی‌نام')+'  '), el('span',null, h.sent?'✓ ارسال‌شده':'⚠ ارسال‌نشده'), el('div','sub',h.at||''));
    const info=el('div','hint'); const r=el('div','acts'); r.style.marginTop='6px';
    const sb=el('button','btn sm'+(h.sent?' ghost':''), h.sent?'ارسال دوباره':'ارسال'); sb.onclick=()=>shareAgain(h,info);
    const vb=el('button','btn ghost','نمایش متن'); vb.onclick=()=>{ const ta=el('textarea','out'); ta.readOnly=true; ta.value=h.text; ta.style.minHeight='200px'; b.appendChild(ta); vb.remove(); };
    r.append(sb,vb); b.append(r,info); chat.appendChild(b); });
  const back=el('button','btn','برگشت به فرم'); back.onclick=()=>render(); bar.appendChild(back);
}
$('histBtn').onclick=()=>renderHistory();
function renderViewOnly(){
  chat.innerHTML=''; bar.innerHTML='';
  const L=CUST.filter(c=>c.viewOnly);
  bubble('bot','این '+L.length+' فروشگاه مشتری قلمک هستند. برای اطلاع تو هستند؛ فعلاً ویزیتشان نکن.');
  L.forEach(c=>{ const b=el('div','msg bot'); b.style.maxWidth='100%'; b.append(el('b',null,'⛔ '+c.name), el('div','sub',[c.kind, c.street, c.qStatus?('وضعیت: '+c.qStatus):''].filter(Boolean).join(' · '))); chat.appendChild(b); });
  const back=el('button','btn','برگشت به فرم'); back.onclick=()=>render(); bar.appendChild(back);
}
$('viewBtn').onclick=()=>renderViewOnly();

function renderDone(){
  const files=photoFiles();
  const canFiles = files.length && navigator.canShare && (()=>{ try{ return navigator.canShare({files}); }catch(e){ return false; } })();
  bubble('bot', files.length
    ? (canFiles ? 'تموم شد ✓ اول «۱. ارسال عکس‌ها» رو بزن و چت گروه رو انتخاب کن، بعد «۲. ارسال متن» رو بزن و همون چت رو انتخاب کن.' : 'تموم شد ✓ متن رو کپی کن. عکس‌ها رو با دکمه‌های «ذخیره عکس» روی گوشی ذخیره کن و همراه متن بفرست.')
    : 'تموم شد ✓ «ارسال» رو بزن یا متن رو کپی کن و توی واتس‌اپ یا بله بفرست.');
  const box=el('div','done');
  if(files.length){ const th=el('div','thumbs'); [['front'],['freezer'],['shelf']].forEach(([k])=>{ if(photos[k]){ const im=el('img'); im.src=photos[k]; im.alt='عکس'; th.appendChild(im); } }); box.appendChild(th); }
  const ta=el('textarea','out'); ta.id='out'; ta.readOnly=true; ta.value=buildText();
  if(!st.key){ st.key=String(Date.now()); save(); }
  histUpsert(st.key,{name:st.ans.name||st.ans.storeName||'بی‌نام', at:faDate(new Date())+' – '+new Date().toTimeString().slice(0,5), text:ta.value, photos:Object.values(photos), sent:!!st.sent});
  const markSent=()=>{ st.sent=true; save(); histUpsert(st.key,{sent:true}); };
  const acts=el('div','acts');
  const cp=el('button','btn','کپی متن');
  cp.onclick=()=>{ const done=()=>cp.textContent='کپی شد ✓';
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ ta.focus(); ta.select(); try{ document.execCommand('copy') && done(); }catch(e){} }); }
    else { ta.focus(); ta.select(); try{ document.execCommand('copy') ? done() : cp.textContent='متن انتخاب شد، کپی کن'; }catch(e){ cp.textContent='متن انتخاب شد، کپی کن'; } } };
  const info=el('div','hint');
  const copyText=()=>new Promise(res=>{ const ok=()=>res(true);
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(ta.value).then(ok).catch(()=>{ ta.focus(); ta.select(); try{ res(document.execCommand('copy')); }catch(e){ res(false); } }); }
    else { ta.focus(); ta.select(); try{ res(document.execCommand('copy')); }catch(e){ res(false); } } });
  const shareText=async()=>{
    info.textContent='';
    if(navigator.share){ try{ await navigator.share({text:ta.value}); markSent(); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
    const ok=await copyText(); if(ok) markSent();
    info.textContent=(ok?'متن کپی شد. ':'متن رو دستی کپی کن. ')+'واتس‌اپ یا بله رو باز کن و بچسبون.';
  };
  let sh;
  if(files.length){
    sh=el('button','btn ghost','۱. ارسال عکس‌ها');
    sh.onclick=async()=>{
      info.textContent='';
      const copied=await copyText();
      if(canFiles){ try{ await navigator.share({files, text:ta.value}); markSent(); info.textContent='عکس‌ها رفت. اگر متن همراهش نرفت، '+(copied?'متن کپی شده؛ توی همون چت بچسبون':'')+' یا دکمه «۲. ارسال متن» رو بزن.'; return; }catch(e){ if(e&&e.name==='AbortError') return; } }
      info.textContent='ارسال عکس از اینجا ممکن نیست؛ با «ذخیره عکس» ذخیره کن و از گالری بفرست. '+(copied?'متن هم کپی شده.':'');
    };
    const st2=el('button','btn ghost','۲. ارسال متن'); st2.onclick=shareText;
    acts.append(sh,st2);
  } else {
    sh=el('button','btn ghost','ارسال متن'); sh.onclick=shareText; acts.append(sh);
  }
  files.forEach(f=>{ const a=el('a','btn ghost','ذخیره عکس '+(f.name.includes('فریزر')?'فریزر':'سردر')); a.href=URL.createObjectURL(f); a.download=f.name; acts.appendChild(a); });
  const nx=el('button','btn ghost','ویزیت بعدی'); nx.style.gridColumn='1 / -1';
  const goNext=()=>{ st=fresh(); photos={}; st.idx=nextIdx(0); save(); render(); };
  const warnBox=el('div'); warnBox.hidden=true;
  nx.onclick=()=>{ if(st.sent) return goNext();
    warnBox.innerHTML=''; warnBox.hidden=false;
    warnBox.append(el('div','hint','این ویزیت هنوز فرستاده نشده! اگه بری ویزیت بعدی، فقط از «ویزیت‌های اخیر» بالای صفحه می‌تونی دوباره بفرستیش.'));
    const r=el('div','acts'); const no=el('button','btn','برگرد و بفرست'); no.onclick=()=>{ warnBox.hidden=true; };
    const yes=el('button','btn ghost','بدون ارسال، ویزیت بعدی'); yes.onclick=goNext; r.append(no,yes); warnBox.appendChild(r); scroll(); };
  acts.appendChild(nx); box.append(ta,acts,info,warnBox);
  const bk=el('button','linkbtn back','→ برگرد و اصلاح کن'); bk.onclick=back; box.appendChild(bk);
  box.appendChild(el('div','ver','اطلاعات: '+DATA_VER));
  chat.appendChild(box); scroll();
}

$('logo').onclick=()=>{ if(!me.activated && me.pendingName && !me.id){ me.id=makeId(); save(); render(); } };
if(st.idx===null || st.idx===undefined) st.idx=nextIdx(0);
if(st.idx>=0 && skipStep(S[st.idx])) st.idx=nextIdx(st.idx);
render();
pullData();
